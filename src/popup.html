<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onliner Price Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1 id="extTitle">Onliner Price Tracker</h1>
        <p class="sub">
          <span id="subtitleBefore">Локально · проверка каждые</span>
          <select id="intervalSelect" class="interval-select"></select>
        </p>
      </div>
      <button type="button" id="checkNow" class="ghost">Проверить сейчас</button>
    </header>

    <section id="importConfirm" class="import-confirm" hidden>
      <p id="importConfirmText" class="import-confirm-text"></p>
      <div class="import-confirm-actions">
        <button type="button" id="importMergeBtn" class="primary-sm">Объединить</button>
        <button type="button" id="importReplaceBtn" class="danger-sm">Заменить</button>
        <button type="button" id="importCancelBtn" class="ghost-sm">Отмена</button>
      </div>
    </section>

    <main>
      <p id="empty" class="empty" hidden>
        <span id="emptyBefore">Откройте товар на </span>
        <a href="https://catalog.onliner.by" target="_blank" rel="noreferrer"
          >catalog.onliner.by</a
        ><span id="emptyAfter"> и нажмите «Следить за ценой».</span>
      </p>
      <ul id="list" class="list"></ul>
    </main>

    <footer class="footer">
      <span id="status" class="status"></span>
      <div class="footer-actions">
        <button type="button" id="exportBtn" class="link-btn">Экспорт</button>
        <span class="sep" aria-hidden="true">·</span>
        <button type="button" id="importBtn" class="link-btn">Импорт</button>
        <input
          type="file"
          id="importFile"
          accept=".json,application/json"
          hidden
        />
      </div>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
