<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onliner Price Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1 id="extTitle">Onliner Price Tracker</h1>
        <p class="sub">
          <span id="subtitleBefore">Локально · проверка каждые</span>
          <span id="intervalLabel">3</span>
          <span id="subtitleAfter">ч</span>
        </p>
      </div>
      <button type="button" id="checkNow" class="ghost">Проверить сейчас</button>
    </header>

    <main>
      <p id="empty" class="empty" hidden>
        <span id="emptyBefore">Откройте товар на </span>
        <a href="https://catalog.onliner.by" target="_blank" rel="noreferrer"
          >catalog.onliner.by</a
        ><span id="emptyAfter"> и нажмите «Следить за ценой».</span>
      </p>
      <ul id="list" class="list"></ul>
    </main>

    <footer class="footer">
      <span id="status"></span>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
